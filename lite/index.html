<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUminate Lite</title>
<meta name="description" content="LUminate Lite — Verbrennung ab 20 % VKOF, Aufnahme bis Tag 5: Checkliste und Volumentherapie, einfach.">
<meta name="theme-color" content="#f3f5f7">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16212c;--mut:#5b6875;--line:#dde3e9;--soft:#f6f8fa;
--acc:#0e5a78;--acc-bg:#e3f0f5;--ok:#17703f;--ok-bg:#e6f4ec;--warn:#8f5200;--warn-bg:#fff3d9;--err:#b3261e;--err-bg:#fdecea;--info:#24558f;--info-bg:#e9f1fb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
b{font-weight:650}
.mut{color:var(--mut)}.small{font-size:13.5px}
header{background:var(--card)}
.hd{max-width:1100px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px}
.logo{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo span{color:var(--acc);font-weight:600}
.hd select{min-width:0;flex:1;max-width:260px;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 8px}
.hd .sp{flex:1}
.ic{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px;line-height:1}
.pl{max-width:1100px;margin:0 auto;padding:0 12px 8px;display:flex;gap:8px;align-items:center;font-size:14.5px}
.pl .tx{flex:1;min-width:0}
.pl .nm{font-weight:650}
.menu{position:absolute;right:10px;top:54px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(20,35,50,.18);min-width:240px;padding:6px;z-index:40}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:8px}
.menu button:hover{background:var(--soft)}
.menu .ver{padding:8px 12px 4px;color:var(--mut);font-size:12.5px;border-top:1px solid var(--line);margin-top:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;font-size:14.5px;font-weight:600;color:var(--mut);border-top:3px solid transparent;position:relative}
nav.tabs button.on{color:var(--acc);border-top-color:var(--acc)}
.bdg{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:700;line-height:20px;vertical-align:1px}
.bdg.o{background:var(--err);color:#fff}
main{max-width:1100px;margin:0 auto;padding:12px 12px 96px}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:12px;align-content:start;min-width:0}
.card{--sc:#475569;--sb:#eef1f4;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:14px;padding:14px;min-width:0;overflow:hidden}
.card>h2{font-size:16.5px;margin:-14px -14px 12px;padding:9px 14px;min-height:54px;display:flex;align-items:center;gap:8px;background:var(--sb);color:var(--sc);border-bottom:1px solid var(--line)}
.card>h2 .r{margin-left:auto;font-weight:400;font-size:13.5px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .l{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.tile .v{font-size:21px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.box{border-radius:12px;padding:11px 12px;margin:8px 0;border-left:5px solid var(--info);background:var(--info-bg)}
.box.ok{border-color:var(--ok);background:var(--ok-bg)}.box.w{border-color:#d08a00;background:var(--warn-bg)}.box.e{border-color:var(--err);background:var(--err-bg)}
.box .bh{font-weight:700;font-size:16.5px}
.box.main .bh{font-size:18.5px}
.box .bt{font-size:14.5px;margin-top:3px}
.box .ba{margin-top:9px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14.5px}
.btn.dng{color:var(--err);border-color:#e7b9b5}
.btn.lnk{border:0;background:none;color:var(--acc);padding:4px 6px;min-height:0;text-decoration:underline}
.rv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);margin-bottom:8px}
.rv.d{background:var(--warn-bg);border-color:#ecd08f}.rv.o{background:var(--err-bg);border-color:#efb4ae}
.rv .o{color:var(--err)}.rv .d{color:var(--warn)}
.hl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.hl li{font-size:14.5px;padding:8px 10px;border-radius:10px;background:var(--info-bg)}
.hl li.w{background:var(--warn-bg)}.hl li.e{background:var(--err-bg);font-weight:600}
.it{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.cb{width:34px;height:34px;border-radius:9px;border:2px solid #9aa7b3;background:#fff;font-size:19px;font-weight:700;line-height:1;color:#fff;padding:0}
.it.st-done .cb{background:var(--ok);border-color:var(--ok)}
.it.st-na .cb{background:#aab4be;border-color:#aab4be}
.it.st-over .cb{border-color:var(--err)}
.it.st-due .cb{border-color:#d08a00}
.it.st-done .itx,.it.st-na .itx{color:var(--mut)}
.it.st-wait .itx{color:#44515d}
.itx{font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.itx .sub{display:block;font-size:13px;color:var(--mut)}
.itx .miss{color:var(--err)}
.fr{font-size:13px;color:var(--mut);margin-top:1px}
.st-over .fr{color:var(--err);font-weight:650}.st-due .fr{color:var(--warn);font-weight:650}
.flag{display:inline-block;padding:0 7px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--warn-bg);color:var(--warn)}
.flag.r{background:var(--err);color:#fff}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--acc);font-weight:700;font-style:italic;font-family:Georgia,serif;font-size:16px;padding:0;flex:none}
.ib.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.info{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:0 0 10px;display:grid;gap:7px}
.info b{color:var(--acc)}
.x{width:34px;height:34px;display:grid;place-items:center;color:var(--err);font-weight:700;font-size:18px}
.ph-h{display:flex;align-items:center;gap:8px;width:calc(100% + 28px);margin:-14px;background:var(--sb);border:0;padding:14px;text-align:left}
.ph-h.op{margin-bottom:0;border-bottom:1px solid var(--line)}
.ph-h h3{font-size:16.5px;flex:1;min-width:0;color:var(--sc)}
.ph-h .tm{font-size:13.5px;font-weight:650;color:var(--sc);white-space:nowrap}
.ph-h .fold{width:18px;color:var(--sc)}
.ph-b{margin-top:10px}
.card.now{box-shadow:0 0 0 3px var(--sc)}
.card.now .ph-h{background:var(--sc)}
.card.now .ph-h h3,.card.now .ph-h .tm,.card.now .ph-h .fold{color:#fff}
.nowb{padding:1px 9px;border-radius:999px;background:#fff;color:var(--sc);font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.card.past{--sc:#5f6b78;--sb:#eef0f2;border-left-color:#aab4be;background:#fafbfc}
.card.past .ph-h h3{font-weight:600}
.hm,.only-d{display:none}
.card.past .it .itx{color:var(--mut)}
.grp{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:12px 0 2px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{display:grid;gap:3px;min-width:0}
.f>span{font-size:13px;color:var(--mut)}
.f.w2{grid-column:1/-1}
input,select,textarea{width:100%;min-height:44px;border:1px solid #c5ced6;border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid #c5ced6;background:#fff;font-size:14.5px}
.seg button.on,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.zl{display:grid;gap:4px;margin:6px 0}
.zr{display:flex;gap:8px;align-items:baseline;font-size:15px;padding:5px 0;border-top:1px solid var(--line)}
.zr:first-child{border-top:0}
.zr .mk{width:22px;font-weight:800;text-align:center}
.mk.y{color:var(--ok)}.mk.n{color:var(--err)}.mk.u{color:var(--mut)}
.zr .zv{margin-left:auto;color:var(--mut);font-size:14px;text-align:right}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:14.5px}
.facts span{display:block;color:var(--mut)}
.facts b{display:block;color:var(--ink);font-size:16.5px}
.facts .bad b{color:var(--err)}.facts .warn b{color:var(--warn)}
.log{display:grid}
.lg{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.lg:first-child{border-top:0}
.lg .t{color:var(--mut);font-variant-numeric:tabular-nums}
.lg button{width:34px;height:34px;border:0;background:none;color:var(--mut);font-size:18px;border-radius:8px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{padding:6px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.tb th{font-weight:600;color:var(--mut);border-top:0;white-space:normal}
table.tb td:first-child,table.tb th:first-child{text-align:left}
.scroll{overflow-x:auto}
.dlgbg{position:fixed;inset:0;z-index:50;background:rgba(20,32,44,.5);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:#fff;width:100%;max-width:760px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.dlg h2{font-size:19px}
.dh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.dlg h3{font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:16px 0 8px}
.df{position:sticky;bottom:-16px;background:#fff;padding:12px 0 2px;margin-top:14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.an{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft)}
.an.q.cur{border-color:var(--acc);background:#fff}
.an-h{font-weight:700;margin-bottom:4px}
.az{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.az .lb{font-weight:600}
.az.n .lb{color:var(--err)}.az.y .lb{color:var(--ok)}
.az-n{font-size:13.5px;color:var(--warn);padding-bottom:6px}
.an-r{margin-top:6px;font-size:15px}
.aq{font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.arr{text-align:center;color:var(--mut);line-height:1.2;padding:2px 0}
.alt{margin-top:12px;display:grid;gap:8px}
.alt .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alt input{width:120px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;background:#16212c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{max-width:560px;margin:8vh auto 0;text-align:center;display:grid;gap:14px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.foot{margin-top:16px;font-size:12.5px;color:var(--mut);text-align:center}
.leg{columns:2 220px;font-size:14px;gap:18px}
.leg div{break-inside:avoid;padding:2px 0}
/* Abschnittsfarben */
.s-vol{--sc:#1d5fa8;--sb:#e6effa}.s-due{--sc:#9a5800;--sb:#fff1d2}.s-std{--sc:#0f6f66;--sb:#e0f3f0}
.s-ein{--sc:#334155;--sb:#e9edf2}.s-bil{--sc:#6a46a3;--sb:#f0e9f9}.s-log{--sc:#5b6875;--sb:#eef1f4}
.s-auf{--sc:#b8400c;--sb:#fde9dc}.s-h0{--sc:#a85a00;--sb:#fdefd3}.s-h8{--sc:#806400;--sb:#f9f1c9}
.s-h24{--sc:#47730e;--sb:#ebf4dc}.s-t3{--sc:#0f6f66;--sb:#e0f3f0}.s-t4{--sc:#1d5fa8;--sb:#e6effa}.s-t5{--sc:#6a46a3;--sb:#f0e9f9}
.s-no{--sc:#b3261e;--sb:#fdeae8}
.tile{border-top:4px solid #334155}
/* Leiste: Timer und Inhalations-Status, immer sichtbar */
.stick{position:sticky;top:0;z-index:25;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(20,35,50,.07)}
.bar{max-width:1100px;margin:0 auto;padding:6px 12px 7px}
.tms{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px}
.tmr{display:block;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:4px 6px 5px;text-align:center;min-width:0;min-height:0;color:var(--ink)}
.tmr span{display:block;font-size:11.5px;line-height:1.25;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr b{display:block;font-size:19px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
button.tmr{cursor:pointer}
.tmr.due{border-color:#d08a00;animation:bl-due 1s steps(1) infinite}
.tmr.over{border-color:var(--err);animation:bl-over 1s steps(1) infinite}
.tmr.due span{color:#5c3600;font-weight:700}
.tmr.due span,.tmr.over span{font-size:10px;letter-spacing:-.25px}
.tmr.over span,.tmr.over b{color:#fff}
.tmr.over span{font-weight:700}
@keyframes bl-due{0%{background:#ffd75e}50%{background:#fff3d9}}
@keyframes bl-over{0%{background:#b3261e}50%{background:#e2574c}}
@media (prefers-reduced-motion:reduce){.tmr.due{animation:none;background:#ffd75e}.tmr.over{animation:none;background:#b3261e}}
.scs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sc{display:inline-block;min-height:0;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:650;line-height:1.4;border:1.5px dashed #94a1ad;background:#fff;color:var(--mut)}
.sc.v{border:1.5px solid var(--err);background:var(--err);color:#fff}
.sc.n{border:1.5px solid #8cc3a3;background:var(--ok-bg);color:var(--ok)}
/* Abfrage Inhalation */
.scr{border:1px solid #e3b3c8;border-left:5px solid #9d174d;background:#fdf0f5;border-radius:12px;padding:10px 12px;margin:8px 0 6px}
.scr-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.scr-h b{color:#9d174d;font-size:16px}
.scr .it{border-top-color:#ecc9d8}
.seg button.on.j{background:var(--err);border-color:var(--err)}
.seg button.on.nn{background:var(--ok);border-color:var(--ok)}
.sq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sq.j .lb{color:var(--err);font-weight:650}
.sq .seg{flex-wrap:nowrap}
.steps{margin-top:6px}
.stp{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid rgba(0,0,0,.09);font-size:14.5px}
.stp:first-child{border-top:0}
.tiles.n3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tiles.n3 .tile{padding:8px}
.tiles.n3 .tile .l{font-size:11px;letter-spacing:.2px}
.tiles.n3 .tile .v{font-size:17px}
.tiles.n3 .tile .s{font-size:12px}
#print{display:none}
@media (min-width:640px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
  .hm{display:inline}
  .tiles.n3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tiles.n3 .tile{padding:10px 12px}
  .tiles.n3 .tile .l{font-size:12.5px;letter-spacing:.4px}
  .tiles.n3 .tile .v{font-size:21px}
  .tiles.n3 .tile .s{font-size:13px}
  .form{grid-template-columns:repeat(4,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .az{grid-template-columns:minmax(0,1fr) auto;align-items:center}
}
@media (min-width:900px){
  .bar{display:flex;gap:16px;align-items:center;justify-content:space-between}
  .tms{grid-template-columns:150px 170px 210px;gap:8px}
  .scs{margin-top:0}
  .tmr.due span,.tmr.over span{font-size:11.5px;letter-spacing:0}
  .sc{font-size:13.5px;padding:4px 11px}
  nav.tabs{position:static;border-top:1px solid var(--line);justify-content:center;padding:0}
  nav.tabs button{flex:0 0 190px;border-top:0;border-bottom:3px solid transparent;padding:11px 4px 9px;font-size:15.5px}
  nav.tabs button.on{border-bottom-color:var(--acc)}
  main{padding-bottom:40px}
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .only-d{display:block}
  .only-m{display:none}
  .cols.w{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
  .dlgbg{align-items:center}
  .dlg{border-radius:18px;padding:20px}
  .df{bottom:-20px}
  .toast{bottom:28px}
  .pform{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media print{
  body{background:#fff;font-size:10.5pt}
  #app{display:none}
  #print{display:block}
  #print h1{font-size:15pt}
  #print h2{font-size:12pt;margin:10pt 0 3pt;border-bottom:1pt solid #000}
  #print h3{font-size:10.5pt;margin:7pt 0 2pt}
  #print .pm{font-size:9.5pt;margin:2pt 0 4pt}
  #print ul{list-style:none;margin:0;padding:0}
  #print li{padding:1.5pt 0;break-inside:avoid}
  #print .sub{font-size:9pt}
  #print .flag,#print .ib{display:none}
  #print table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #print td,#print th{border:.5pt solid #777;padding:2pt 4pt;text-align:left}
  #print .lgd{font-size:8pt;margin-top:10pt;border-top:.5pt solid #777;padding-top:4pt}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
"use strict";
/* =====================================================================
   LUminate Lite — vereinfachtes Spin-off von LUminate (Verbrennung ≥ 20 % VKOF, Aufnahme bis Tag 5).
   Gleiche Inhalte (Checkliste, Daueranweisungen, Volumentherapie nach SOP, Algorithmus), einfachere Oberfläche.
   Eigenständig: eigener Speicher (lulite_v1), keine Kopplung mit BurnICU. Eine Datei, kein Build.
   ===================================================================== */
const APP_VERSION = "1.2.0";
const SKEY = "lulite_v1";
const H = 36e5, MIN = 6e4;

      if (v.d0 < -grenze(v.soll0)) {
        const kopf = `Defizit aus Präklinik/Schockraum: ${tsd(-v.d0)} ml unter Soll`;
        if (rest <= 250) out.vol = { lv: "ok", h: kopf + " — inzwischen ausgeglichen", t: zahl + ` Seit Übernahme ${tsd(surplus)} ml über der Rule of 10 gegeben. Weiter stündlich nach Diurese.` };
        else if (dLow === false) out.vol = { lv: "i", h: kopf, t: zahl + ` Noch offen ${tsd(rest)} ml — Diurese ist im Ziel: nicht nachschieben, weiter stündlich nach Diurese titrieren.` };
        else if (dLow == null) out.vol = { lv: "i", h: kopf, t: zahl + ` Noch offen ${tsd(rest)} ml — erst aktuelle Stundendiurese eintragen; nachgeschoben wird nur bei Diurese unter Ziel.` };
        else if (out.hold) out.vol = { lv: "i", h: kopf, t: zahl + ` Noch offen ${tsd(rest)} ml, Diurese unter Ziel — das Ergebnis der letzten Reevaluation gilt bis ${fT(out.hold)}: dann neu bewerten, vorher nicht nachschieben.` };
        else {
          const n = v.hJ < 6 ? Math.max(2, Math.round(8 - v.hJ)) : 4;
          let neu = r10(base + rest / n);
          const cap = r10(2 * c.rot), capped = neu > cap;
          if (capped) neu = cap;
          out.vol = { lv: "w", h: kopf, t: zahl + ` Noch offen ${tsd(rest)} ml, Diurese unter Ziel → Aufholrate für ${n} h: ${r0(neu)} ml/h${capped ? " (gedeckelt auf 2 × Rule of 10)" : ""}, danach wieder stündlich nach Diurese. Geht über den SOP-Schritt (+20 %) hinaus — ärztliche Entscheidung.`, neu: neu > base ? neu : null, aufhol: true };
        }
      } else if (v.d0 > grenze(v.soll0)) {
        const kopf = `Übertherapie aus Präklinik/Schockraum: ${tsd(v.d0)} ml über Soll`;
        if (dLow === true) out.vol = { lv: "e", h: kopf + " — trotzdem Diurese unter Ziel", t: zahl + " Nicht blind weiter steigern: intraabdominellen Druck (abdominelles Kompartmentsyndrom), HI/PiCCO, Blutung, Myoglobin und Katheterlage prüfen." };
        else if (out.ev && out.ev.anyFail) out.vol = { lv: "w", h: kopf, t: zahl + ` Ziele verfehlt (${out.ev.crit.filter((x) => x.st === false).map((x) => x.l).join(", ")}): Steigern nach SOP möglich, aber vorher intraabdominellen Druck, HI/PiCCO, Blutung und Katheterlage prüfen — Fluid Creep.` };
        else if (out.ev && out.ev.allOk && out.hold) out.vol = { lv: "w", h: kopf, t: zahl + ` Alle Ziele erfüllt: Fluid Creep vermeiden — bei der nächsten Reevaluation (${fT(out.hold)}) −10 %.` };
        else if (out.ev && out.ev.allOk) {
          const neu = rate != null ? r10(rate * 0.9) : null;
          out.vol = { lv: "w", h: kopf, t: zahl + ` Alle Ziele erfüllt: Fluid Creep vermeiden, −10 % je Stunde${neu ? ` (jetzt ${r0(neu)} ml/h)` : ""}.`, neu };
        } else out.vol = { lv: "w", h: kopf, t: zahl + " Fluid Creep vermeiden: senken (−10 %), sobald alle Ziele erfüllt sind; über die Rule of 10 nur bei verfehlten Zielen steigern." };
      } else out.vol = { lv: "ok", quiet: true, h: "Volumen ab Unfall passt zur Rule of 10", t: `Bis Übernahme ${tsd(v.g)} ml gegeben, Soll ${tsd(v.soll0)} ml (Abweichung < 20 %). Kristalloid seit Unfall ${tsd(v.kris)} ml.` };
    }
    if (out.hold && out.vol && out.vol.neu) { out.vol.neu = null; out.vol.aufhol = false; out.vol.t += ` Anpassung frühestens bei der nächsten Reevaluation (${fT(out.hold)}).`; }
  }
  /* weitere Hinweise */
  const add = (lv, t, act) => out.hints.push({ lv, t, act });
  if (out.ev && out.ev.mapLow) add("e", `MAP ${fN(out.ev.map, 0)} < 65 mmHg: Fluid Challenge (SOP); persistierend Dobutamin bei kardialer Dysfunktion, Noradrenalin > 0,25 µg/kg/min → Argipressin 0,01 IE/min erwägen.`);
  const albNow = valAt(albHist(p), now);
  const albRate = albNow ? albNow.v : 0;
  if (c.h < 6) add("i", `Albumin frühestens ab h 6 (${fT(atMs(c, 6))}) — vorher verlässt es mit dem Kapillarleck das Gefäß.`);
  else if (c.h < 8) add("i", "h 6–8: Albumin 20 % nur erwägen; FFP nur nach Gerinnungssituation (nicht mandatorisch).");
  else if (!albRate && rate) add("w", `Ab h 8 Albumin 20 % nach SOP: 100 ml je 1000 ml Volumen ≈ ${r0(rate / 10)} ml/h (Ziel-Albumin 2,2–2,7 g/dl); FFP nur nach Gerinnungssituation.`, { k: "alb", v: Math.round(rate / 10) });
  const alb = last(lab(p, "Albumin"));
  if (alb && c.h >= 8) {
    if (alb.v > 2.7 && albRate) add("i", `Albumin ${fN(alb.v, 1)} g/dl über Ziel (2,2–2,7) — Perfusor reduzieren bzw. pausieren.`);
    if (alb.v < 2.2) add("w", `Albumin ${fN(alb.v, 1)} g/dl unter Ziel (2,2–2,7 g/dl).`);
  }
  const na = lastIn(lab(p, "Na"), now, 12 * H);
  if (na && na.v > 139 && p.lsg !== "delta") add("w", `Natrium ${fN(na.v, 0)} > 139 mmol/l → Ringer-Azetat auf Eindrittelelektrolytlösung (Deltajonin BG (1/3), Na 45/K 25) umstellen (Ziel 135–139).`, { k: "lsg", v: "delta" });
  if (na && na.v < 135 && p.lsg === "delta") add("w", `Natrium ${fN(na.v, 0)} < 135 mmol/l unter Deltajonin BG (1/3) — zurück auf Ringer-Azetat? (Ziel 135–139)`, { k: "lsg", v: "ra" });
  if (v && c.ivy) {
    const v24 = c.h >= 24 ? vol(p, c, c.u + 24 * H) : v;
    const pr = v24.ges / c.ivy * 100;
    if (pr > 100) add("e", `Ivy-Index überschritten: ${tsd(v24.ges)} ml in ${c.h >= 24 ? "h 0–24" : fN(c.h, 0) + " h"} (> 250 ml/kg) — hohes Risiko für ein abdominelles Kompartmentsyndrom: IAP messen, Zufuhr drosseln.`);
    else if (pr >= 80 && c.h < 24) add("w", `${fN(pr, 0)} % des Ivy-Index (250 ml/kg in 24 h) erreicht.`);
    const mk = v24.ges / (c.kg * c.vk);
    if (mk > 6 && pr <= 100) add("w", `Über 6 ml/kg/% VKOF (${fN(mk, 1)}) — Kolloid-Rescue (Albumin) erwägen statt weiter Kristalloid.`);
  }
  const iap = last(ser(p, "iap"));
  if (iap) {
    if (iap.v > 20) add("e", `IAP ${fN(iap.v, 0)} mmHg (${fT(iap.t)}): Verdacht auf abdominelles Kompartmentsyndrom — Organdysfunktion prüfen, Volumen drosseln, Chirurgie informieren.`);
    else if (iap.v >= 12) add("w", `IAP ${fN(iap.v, 0)} mmHg: intraabdominelle Hypertonie (≥ 12) — engmaschig messen, Volumen kritisch prüfen.`);
  }
  if (c.strom && !c.myo) add("i", "Stromunfall: Urinfarbe/Myoglobin prüfen — bei Myoglobinurie Ziel 1,5–2 ml/kg/h bzw. 200–300 ml/h („Myoglobinurie“ beim Patienten ankreuzen).");
  if (c.rotNA) add("w", "Unter 40 kg gilt die Rule of 10 nicht — Kinderschema der Klinik, Zieldiurese 1–1,5 ml/kg/h.");
  return out;
}

    case "setrate": if (p) setRate(p, Number(d.v)); break;
    case "albset": if (p) { addEv(p, { t: Date.now(), k: "alb", v: Number(d.v) }); save(); toast(`Albumin 20 % ${d.v} ml/h ab ${fT(Date.now())}`); } break;
    case "lsg": if (p) { p.lsg = d.v; addEv(p, { t: Date.now(), k: "lsg", v: d.v }); save(); toast("Lösung: " + lsgName(p)); } break;
    case "evdel": if (p && confirm("Diesen Eintrag löschen?")) { p.ev = p.ev.filter((e) => e.id !== d.k); save(); } break;
    case "algo": if (p) { UI.algo = null; UI.dlg = "algo"; } break;
    case "scropen": if (p) UI.dlg = "scr"; break;
    case "scr": if (p) { scrCommit(p); scrSet(p, d.k, scrAns(p, d.k) === d.v ? null : d.v); save(); } break;
    case "scrdone": if (p) { scrCommit(p); save(); UI.dlg = null; } break;
    case "ihtset": if (p) { p.f.inhal = true; save(); const c2 = calc(p); toast("V. a. Inhalationstrauma übernommen" + (c2.rot != null ? ` — Rule of 10 jetzt ${r0(c2.rot)} ml/h` : "")); } break;
    case "algo_z": if (UI.algo) UI.algo.z[d.k] = d.v; break;
    case "algo_a": if (UI.algo) { UI.algo.a[d.k] = d.v; if (d.k !== "dys") ALGO_ORDER.slice(ALGO_ORDER.indexOf(d.k) + 1).forEach((k) => { delete UI.algo.a[k]; }); } break;
    case "algo_done": algoFinish(d.res, d.to); break;
    case "algo_manual": { const v = numDE(UI.draft.al_rate); if (v == null || v < 0) { toast("Laufrate in ml/h eintragen"); break; } delete UI.draft.al_rate; algoFinish("manuell", v); break; }
    case "reeval_ok": if (p) { const rr = valAt(rateHist(p), Date.now()); addEv(p, { t: Date.now(), k: "re", res: "ok", from: rr ? rr.v : null, to: null, path: "" }); save(); toast("Reevaluation ohne Änderung — nächste in 1 h"); } break;
  }
  UI.menu = false;
  render();
}

/* ---------- Rendern, Ereignisse, Takt ---------- */
function render() {
  const p = cur();
  const dl = document.querySelector(".dlg");
  const sc = dl && render.dlg === UI.dlg ? dl.scrollTop : 0;
  render.dlg = UI.dlg;
  let h;
  if (!p) h = vHeader(null, null) + vEmpty();
  else {
    const c = calc(p), P = plan(p, c);
    h = vHeader(p, c) + `<div class="stick">${vBar(p, c)}${vTabs(p, c)}</div><main>${vTiles(p, c)}${S.tab === "vol" ? vVol(p, c, P) : S.tab === "check" ? vCheck(p, c) : vJetzt(p, c, P)}</main>` + vDialog(p, c);
    const rd = reevalDue(p, c);
    document.title = (rd && c.now >= rd.over ? "⚠ Reevaluation · " : "") + "LUminate Lite";
  }
  if (!p) { h += vDialog(null, null); document.title = "LUminate Lite"; }
  if (UI.toast) h += `<div class="toast" role="status">${esc(UI.toast)}</div>`;
  APP.innerHTML = h;
  document.body.style.overflow = UI.dlg ? "hidden" : "";
  const d2 = document.querySelector(".dlg");
  if (d2 && sc) d2.scrollTop = sc;
  tickTimers();
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) { if (UI.menu && !e.target.closest(".menu")) { UI.menu = false; render(); } return; }
  act(el.dataset.act, el);
});
function onField(el) {
  if (el.dataset.d) UI.draft[el.dataset.d] = el.value;
  else if (el.dataset.pd && UI.pd) { const k = el.dataset.pd; if (k.indexOf("ueb.") === 0) UI.pd.ueb[k.slice(4)] = el.value; else UI.pd[k] = el.value; }
}
document.addEventListener("input", (e) => onField(e.target));
document.addEventListener("change", (e) => {
  if (e.target.id === "psel") { S.sel = e.target.value; save(); UI.draft = {}; render(); return; }
  onField(e.target);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (UI.dlg || UI.menu)) { const p0 = cur(); if (UI.dlg === "scr" && p0) { scrCommit(p0); save(); } UI.dlg = null; UI.pd = null; UI.algo = null; UI.menu = false; render(); }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.d && /^e_/.test(e.target.dataset.d)) { onField(e.target); saveEntry(); render(); }
});
window.addEventListener("afterprint", () => { document.getElementById("print").innerHTML = ""; });
window.addEventListener("storage", (e) => { if (e.key === SKEY) { S = load(); Object.values(S.pats).forEach(norm); render(); } });

/* Erinnerungen: Browser-Meldung, solange die App offen ist */
const notified = new Set();
function toggleNotif() {
  if (S.notif) { S.notif = false; save(); return toast("Erinnerungen aus"); }
  if (!("Notification" in window)) return toast("Dieser Browser kann keine Meldungen anzeigen — die Hinweise in der App bleiben.");
  Notification.requestPermission().then((r) => { S.notif = r === "granted"; save(); toast(S.notif ? "Erinnerungen an — solange die App offen ist" : "Meldungen sind im Browser blockiert"); render(); });
}
function notifyTick() {
  const p = cur();
  if (!p || !S.notif || !("Notification" in window) || Notification.permission !== "granted") return;
  const c = calc(p);
  laufend(p, c).forEach((x) => {
    if (!x.st) return;
    const key = p.id + x.k + (x.k === "reeval" ? x.st + Math.floor((c.now - x.due) / (2 * H)) : x.due);
    if (notified.has(key)) return;
    notified.add(key);
    try { new Notification("LUminate Lite · " + (p.name || "Patient"), { body: x.t + (x.st === "o" ? " — überfällig" : " — fällig"), tag: key }); } catch (e) {}
  });
}
setInterval(() => {
  notifyTick();
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  render();
}, 30000);

setInterval(tickTimers, 1000);
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
